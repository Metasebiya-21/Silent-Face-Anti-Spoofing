[project]
name = "liveness-service"
version = "0.1.0"
description = "Passive (silent) face liveness detection with MiniFASNet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python<5",  # 5.x dropped cv2.dnn.readNetFromCaffe, which the face detector needs
    "pillow",
    "torch",
]

[project.optional-dependencies]
train = [
    "easydict",
    "tensorboardx",
    "torchvision",
    "tqdm",
]
api = [
    "fastapi",
    "httpx",  # proxies tus requests to tusd
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
liveness-service = "liveness_service.cli:main"
liveness-train = "training.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["liveness_service", "training"]  # the service, and training as its own top-level package
